# 每日開支儀表板優化：冪等（同一香港日最多啟用一項）
#
# 觸發來源：
# 1. GitHub schedule：02:07 / 02:23 / 02:41 UTC ≈ HKT 10:07/10:23/10:41（唯一寫入者）
# 2. Vercel Cron → workflow_dispatch（備援，唔直接 commit，避免雙寫衝突）
# 3. workflow_dispatch（手動）
#
# 無限期運作：全部啟用後進入輪播，每日仍更新，永不停止。
# 衝突標記／壞 JSON：run.mjs 會自動修復並 commit。

name: Daily Optimization

on:
  schedule:
    - cron: "7 2 * * *"
    - cron: "23 2 * * *"
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-optimization
  cancel-in-progress: false

jobs:
  enable-next-feature:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Run daily optimization script
        id: opt
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- universal/src/data/enabledExpenseFeatures.json optimization_history.json; then
            echo "::warning::偵測到衝突標記，交由 run.mjs 自動修復。"
          fi
          node scripts/daily-optimization/run.mjs
          if [[ -f .daily-opt-repaired ]]; then
            echo "repaired=true" >> "$GITHUB_OUTPUT"
            echo "JSON auto-repaired."
          else
            echo "repaired=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -f .daily-opt-skip ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No new feature to enable."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            if [[ -f .daily-opt-result.json ]]; then
              TITLE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.daily-opt-result.json','utf8')).title)")
              ID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.daily-opt-result.json','utf8')).id)")
              echo "title=$TITLE" >> "$GITHUB_OUTPUT"
              echo "id=$ID" >> "$GITHUB_OUTPUT"
            fi
          fi
          node scripts/daily-optimization/ensure-feature-json.mjs --check

      - name: Commit and push
        if: steps.opt.outputs.skip == 'false' || steps.opt.outputs.repaired == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f .daily-opt-skip .daily-opt-result.json .daily-opt-repaired

          git add universal/src/data/enabledExpenseFeatures.json optimization_history.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          if [[ "${{ steps.opt.outputs.skip }}" == "false" ]]; then
            TITLE="${{ steps.opt.outputs.title }}"
            ID="${{ steps.opt.outputs.id }}"
            MSG="$(cat <<EOF
          feat(daily): enable ${ID} — ${TITLE}

          Automated daily expense dashboard optimization.
          EOF
          )"
          else
            MSG="$(cat <<EOF
          fix(daily): auto-repair expense feature JSON conflict markers

          Automated recovery so daily optimization can continue.
          EOF
          )"
          fi
          git commit -m "$MSG"

          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:${{ github.ref_name }} && exit 0
            echo "Push conflict, retry $attempt..."
            sleep 3
          done
          echo "Push failed after retries"
          exit 1
