# 每日開支儀表板優化：冪等（同一香港日最多啟用一項）
#
# 觸發來源：
# 1. GitHub schedule（早上三槽 + 晏晝後備一槽）
#    02:07 / 02:23 / 02:41 UTC ≈ HKT 10:07/10:23/10:41
#    04:15 UTC ≈ HKT 12:15（後備閘門：早上全敗仍有機會）
# 2. Vercel Cron → workflow_dispatch（02:00 / 03:00 UTC 備援，唔直接 commit）
# 3. workflow_dispatch（手動）
#
# 同一 run 內：primary 失敗會自動跑 backup-retry（等 90 秒再試），
# 唔會因為第一次 fail 就完全冇機會。
#
# 無限期運作：全部啟用後進入輪播，每日仍更新，永不停止。
# 衝突標記／壞 JSON：run.mjs 會自動修復並 commit。

name: Daily Optimization

on:
  schedule:
    - cron: "7 2 * * *"
    - cron: "23 2 * * *"
    - cron: "41 2 * * *"
    - cron: "15 4 * * *" # HKT 12:15 backup gate
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-optimization
  cancel-in-progress: false

jobs:
  primary:
    name: Primary attempt
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.opt.outputs.skip }}
      repaired: ${{ steps.opt.outputs.repaired }}
      title: ${{ steps.opt.outputs.title }}
      id: ${{ steps.opt.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Run daily optimization
        id: opt
        run: bash scripts/daily-optimization/ci-run.sh

      - name: Commit and push
        if: steps.opt.outputs.skip == 'false' || steps.opt.outputs.repaired == 'true'
        run: |
          bash scripts/daily-optimization/ci-commit.sh \
            "${{ steps.opt.outputs.skip }}" \
            "${{ steps.opt.outputs.repaired }}" \
            "${{ steps.opt.outputs.title }}" \
            "${{ steps.opt.outputs.id }}"

  # 後備閘門：第一次失敗唔等於今日完結 — 等陣再自動重試一次
  backup-retry:
    name: Backup retry gate
    needs: primary
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Wait before backup retry
        run: |
          echo "Primary attempt failed — backup gate waiting 90s before retry…"
          sleep 90

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Run daily optimization (backup)
        id: opt
        run: bash scripts/daily-optimization/ci-run.sh

      - name: Commit and push (backup)
        if: steps.opt.outputs.skip == 'false' || steps.opt.outputs.repaired == 'true'
        run: |
          bash scripts/daily-optimization/ci-commit.sh \
            "${{ steps.opt.outputs.skip }}" \
            "${{ steps.opt.outputs.repaired }}" \
            "${{ steps.opt.outputs.title }}" \
            "${{ steps.opt.outputs.id }}"
