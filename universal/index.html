<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/universal/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <title>全球萬能旅行 Companion · Trip Companion</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #f2f8f6; color: #12211f; }
      #root { min-height: 100dvh; }
      .tc-boot {
        min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
        justify-content: center; padding: 1.5rem; text-align: center; box-sizing: border-box;
        font-family: system-ui, -apple-system, "PingFang HK", "Noto Sans TC", sans-serif;
      }
      .tc-boot h1 { font-size: 1.2rem; margin: 0 0 0.5rem; }
      .tc-boot p { margin: 0; font-size: 0.875rem; color: #5b6b68; line-height: 1.55; }
      .tc-boot .tc-err {
        margin-top: 0.75rem; max-width: 22rem; max-height: 6rem; overflow: auto;
        text-align: left; font-size: 0.7rem; line-height: 1.4; color: #9a3412;
        background: #fff7ed; border-radius: 0.75rem; padding: 0.6rem 0.75rem;
        word-break: break-word;
      }
      .tc-boot button {
        margin-top: 1rem; min-height: 2.85rem; width: min(100%, 17rem); border: 0;
        border-radius: 1rem; background: #0d9488; color: #fff; font-weight: 700; font-size: 0.95rem;
      }
      .tc-boot a.tc-link {
        margin-top: 0.75rem; font-size: 0.8rem; font-weight: 700; color: #0f766e;
      }
    </style>
    <script>
      // Kill broken SW once — no reload loop (session lock).
      (function () {
        var EPOCH = "10";
        var KEY = "tc_sw_epoch";
        var LOCK = "tc_sw_bust_lock";
        window.__tcBootErrors = [];
        window.addEventListener("error", function (ev) {
          try {
            window.__tcBootErrors.push(String((ev && ev.message) || "error"));
          } catch (e) {}
        });
        window.addEventListener("unhandledrejection", function (ev) {
          try {
            var r = ev && ev.reason;
            window.__tcBootErrors.push(String((r && r.message) || r || "promise"));
          } catch (e) {}
        });
        try {
          if (sessionStorage.getItem(LOCK) === EPOCH) return;
          if (localStorage.getItem(KEY) === EPOCH) return;
          sessionStorage.setItem(LOCK, EPOCH);
          localStorage.setItem(KEY, EPOCH);
        } catch (e) {
          return;
        }
        if (!("serviceWorker" in navigator)) return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }).then(function () {
          if (typeof caches === "undefined") return;
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          });
        }).catch(function () {});
      })();
    </script>
    <script>
      // Register pass-through SW only after load (replaces old broken workers).
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    </script>
    <script src="/storage-migration.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <div class="tc-boot" id="tc-boot">
        <h1>Trip Companion</h1>
        <p>載入中…</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function () {
        var root = document.getElementById("root");
        if (!root) return;
        var booted = false;
        var markBooted = function () {
          if (root.querySelector(".bg-travel, main, #tc-app")) {
            booted = true;
            return true;
          }
          if (!document.getElementById("tc-boot") && root.childNodes.length > 0) {
            booted = true;
            return true;
          }
          return false;
        };
        var obs = new MutationObserver(function () {
          if (markBooted()) obs.disconnect();
        });
        obs.observe(root, { childList: true, subtree: true });

        function showFail() {
          if (booted || markBooted()) return;
          obs.disconnect();
          var errs = (window.__tcBootErrors || []).slice(-3).join(" | ") || "主程式未啟動（可能仍被舊快取攔截）";
          root.innerHTML =
            '<div class="tc-boot">' +
            "<h1>開唔到 App</h1>" +
            "<p>唔好再用主畫面舊圖示。請用 Safari／Chrome 開下面連結，成功後再重新加入主畫面。</p>" +
            '<div class="tc-err" id="tc-err"></div>' +
            '<button type="button" id="tc-hard-reset">清除資料並重試</button>' +
            '<a class="tc-link" href="https://trip-companion-pied.vercel.app/universal/?fresh=1">用瀏覽器開啟</a>' +
            "</div>";
          var errEl = document.getElementById("tc-err");
          if (errEl) errEl.textContent = errs;
          var btn = document.getElementById("tc-hard-reset");
          if (!btn) return;
          btn.onclick = function () {
            var finish = function () {
              location.href = "/universal/?fresh=" + Date.now();
            };
            try {
              sessionStorage.removeItem("tc_sw_bust_lock");
              localStorage.removeItem("tc_sw_epoch");
            } catch (e) {}
            var p = Promise.resolve();
            if ("serviceWorker" in navigator) {
              p = navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              });
            }
            p.then(function () {
              if (typeof caches === "undefined") return;
              return caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              });
            }).catch(function () {}).then(finish);
          };
        }

        // Slow phones / first paint after SW wipe
        setTimeout(showFail, 10000);
      })();
    </script>
  </body>
</html>
