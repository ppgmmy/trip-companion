<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/universal/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <title>全球萬能旅行 Companion · Trip Companion</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #f2f8f6; color: #12211f; }
      #root { min-height: 100dvh; }
      .tc-boot {
        min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
        justify-content: center; padding: 1.5rem; text-align: center; box-sizing: border-box;
        font-family: system-ui, -apple-system, "PingFang HK", "Noto Sans TC", sans-serif;
      }
      .tc-boot h1 { font-size: 1.2rem; margin: 0 0 0.5rem; }
      .tc-boot p { margin: 0.35rem 0 0; font-size: 0.875rem; color: #5b6b68; line-height: 1.55; max-width: 22rem; }
      .tc-boot a, .tc-boot button {
        margin-top: 0.85rem; display: inline-block; font-size: 0.9rem; font-weight: 700;
        color: #fff; background: #0d9488; border: 0; border-radius: 1rem;
        min-height: 2.75rem; padding: 0.65rem 1.1rem; text-decoration: none;
      }
      .tc-boot a.tc-secondary { background: transparent; color: #0f766e; border: 1px solid #0d9488; }
    </style>
    <script>
      // Kill any leftover Service Worker — do NOT re-register.
      (function () {
        if (!("serviceWorker" in navigator)) return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }).then(function () {
          if (typeof caches === "undefined") return;
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          });
        }).catch(function () {});
      })();
    </script>
    <script src="/storage-migration.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <div class="tc-boot" id="tc-boot">
        <h1>全球萬能旅行</h1>
        <p>載入中…</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function () {
        var root = document.getElementById("root");
        if (!root) return;
        var booted = false;
        var markBooted = function () {
          if (root.querySelector(".bg-travel, main, #tc-app")) {
            booted = true;
            return true;
          }
          if (!document.getElementById("tc-boot") && root.childNodes.length > 0) {
            booted = true;
            return true;
          }
          return false;
        };
        var obs = new MutationObserver(function () {
          if (markBooted()) obs.disconnect();
        });
        obs.observe(root, { childList: true, subtree: true });
        setTimeout(function () {
          if (booted || markBooted()) {
            obs.disconnect();
            return;
          }
          obs.disconnect();
          root.innerHTML =
            '<div class="tc-boot">' +
            "<h1>開唔到？</h1>" +
            "<p>請唔好撳主畫面舊圖示。用 Safari／Chrome 開下面連結。</p>" +
            '<a href="https://trip-companion-pied.vercel.app/universal/?fresh=' + Date.now() + '">用瀏覽器開啟</a>' +
            '<a class="tc-secondary" href="/restore.html">還原主畫面 App</a>' +
            "</div>";
        }, 10000);
      })();
    </script>
  </body>
</html>
